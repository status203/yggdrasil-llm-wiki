# Tuneable settings — the default layer, shipped with the program.
# Don't edit here to customise. Override a key for every wiki in your user layer,
# the file echo "${XDG_CONFIG_HOME:-$HOME/.config}/yggdrasil/config.conf" prints, or for one wiki in its own
# .yg/config.conf; at session start the resolver merges default -> user -> wiki into
# the wiki's .yg/resolved/config.conf.
# Flat 'key: value' lines, split on the first colon; values are taken literally
# (may contain '#'). A line starting with '#' is a comment. Per-key meaning: the
# comment above a key where it has one.

# Whether the wiki's content may be seen by others: public | private. Defaults to
# private, so a wiki that never sets it is guarded rather than exposed.
wiki.visibility: private
# Where a public wiki's examples come from: topics, comma-separated, or any. A wiki about one
# topic may name it. Read by the page contract; a private wiki draws from anywhere.
wiki.well: cooking, chess, public speaking
# Each wiki's answer to going public, in its .yg/config.conf and never here: what the answer
# wrote, keys and `gitignore`, or none. Written by /yggdrasil:init § Visibility:
# wiki.public_answered: <what it wrote>

# The wiki format this program reads. A wiki records its own as wiki.format in its
# .yg/config.conf, written by init.sh; the session-start check compares the two. Not a
# setting: never override it.
program.wiki_format: 1
# Each wiki's own format, in its .yg/config.conf and never here, where the default layer
# would fill it in for a wiki that has none:
# wiki.format: <n>

# Days after a page's checkpoint that the staleness review counts it due, by the page's
# volatility. Read by .yg/bin/staleness.sh.
staleness-review.threshold.high: 90
staleness-review.threshold.medium: 180
staleness-review.threshold.low: 365

# Wrap's save bar, as free text: the description is the setting. Read by the wrap skill.
wrap.save_bar_calibration: Apply the criteria as written — save clear keepers, drop ephemera; when genuinely on the fence, lean to saving.
# Whether wrap keeps a session record in .sources/chats/ when a session produced something
# worth keeping: on | always | off. on keeps one in a private wiki only, since in a public
# one it would publish the conversation; always keeps one in a public wiki too.
wrap.save_session_records: on
# Whether wrap pushes after its commit: on | off. Off by default, since a push sends the
# wiki off the machine.
wrap.push: off

# The engine /yggdrasil:transcribe transcribes with when no caption track serves: an adapter's
# name, never a path, found in ${XDG_CONFIG_HOME:-~/.config}/yggdrasil/engines/transcribe/ and
# then in the program's .yg/engines/transcribe/. What an adapter must do is
# .yg/engines/transcribe/contract.md. Read by .yg/bin/transcribe.sh.
transcribe.engine: whisper
# The whisper adapter's speech model, as whisper.cpp tags it; the model file is
# ggml-<tag>.bin. Read by .yg/engines/transcribe/whisper.sh.
transcribe.whisper.model: large-v3-turbo

# Relevance seam — the backend answering "what does the wiki already hold on this",
# config-resolved so a fork can point it at an embedding index or an MCP tool without
# editing shipped mechanism. Value is a dispatch-shape tag:
# subagent:<name> | mcp:<tool>, a name and never a path, as for every seam (D20.1.2). The default dispatches the librarian
# over the generated subject indexes.
index.query_provider: subagent:yggdrasil:munin

# Where each review writes its findings ledgers and disposition record, one key per
# review that keeps them. Relative to the wiki root, absolute, or ~/ under the home
# directory; none -> the findings stay in the session and nothing is written, which
# also loses the history later runs mark findings against. A relative folder is created
# on first use, save one git ignores in a linked worktree, which is refused since removing
# the worktree removes it; an absolute or ~/ one must already exist. Content ledgers name the wiki's
# pages, so they default into the wiki and are tracked with it, save in a top-level dot
# folder other than .yg/, .claude/ or .sources/, which a wiki ignores whole, and except in the program's
# own forge wiki, which gitignores them. System and harness ledgers describe the program,
# and run in a forge session, where the wiki is the program root; the program gitignores
# their default folders too, so a public program carries no one's findings. To keep them
# across machines, or to review from a linked worktree, point them at a store of your own with an absolute path in your user
# layer.
review.content.ledger_location: .yg/ledgers/content
review.system.ledger_location: .yg/ledgers/system
review.harness.ledger_location: .yg/ledgers/harness

# Where the forge ledgers live: the settled decisions and open questions of program work in
# flight. A forge session's start names each *.md at the top of this folder, to be read
# before changing the program. Relative to the program root, absolute, or ~/ under the home
# directory; none -> nothing is named. The program gitignores the default folder, so a
# public program carries no one's ledgers; point it at a store of your own in your user layer.
forge.ledger_location: .yg/ledgers/forge

# Tooling positions — the tool/service preferences that shape what forge mode
# recommends. Read as a namespace (every tooling.* key), not by individual name.
# Shipped at the widest position: assume nothing about what you have access to.
# Owned access belongs to the user layer — record assets as tooling.owned.<slug>
# there; there are no defaults for it.
tooling.privacy: No data sent to third-party services beyond what required tooling needs.
tooling.sovereignty: Tools and data run locally where possible; prefer open-source/self-hosted over hosted services.
tooling.cost: Free tools and free tiers; paid services only on explicit opt-in.
tooling.cross_platform: Prefer tools running on all three supported platforms (Linux, macOS, WSL on Windows). Soft preference — single-platform tools acceptable when no cross-platform peer exists.
